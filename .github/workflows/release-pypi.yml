# rationale: one registry per workflow keeps each trusted-publisher grant narrow
# — the workflow file is the RBAC unit. See, in template.python-project:
# docs/dev/technical-policy.kb/least-privilege-grants.md
name: Release (PyPI)

# The request is a branch; the record is a tag. A human pushes
# `triggers/release/v1.2.3` -- attributable, reviewable, and revocable (delete
# the branch and nothing is burned) -- and the pipeline pushes the `v1.2.3` tag
# only after the upload lands. A tag ruleset admits only the release deploy key,
# so no hand-pushed tag can claim a release happened.
#
# The ref only *states* a version. CHANGELOG.md is what decides it, and
# lib/ci/require-releasable refuses if the two disagree.
on:
  push:
    branches: ["triggers/release/v*"]

  # An upload cannot be taken back; a dispatch can. Dispatch rehearses
  # everything except the prod upload and the tag, against whatever version
  # CHANGELOG.md currently names -- so a rehearsal takes no arguments and can
  # invent nothing.
  workflow_dispatch:

# Two runs releasing one version would both build and then collide at the
# registry, after the irreversible half has begun for one of them.
concurrency:
  group: release-${{ github.ref }}

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version out of tag history, and reachability is
          # unanswerable in a truncated history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      # The pyright wrapper and basedpyright run a JS engine via `node`.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # The whole gate in one verb: the changelog names the version, the request
      # (if any) agrees, the version is unreleased, the tree is clean, and the
      # commit is reachable from the default branch. Runnable at a terminal.
      - name: the release must be permitted
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUEST_REF:
            ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: lib/ci/require-releasable "$GITHUB_SHA" "$REQUEST_REF"

      - name: the platform surface must stay quarantined
        run: lib/ci/require-no-platform-leak

      - id: version
        run: echo "version=$(lib/changelog/get-version)" >>"$GITHUB_OUTPUT"

      # CI runs on pushes to the default branch and on PRs, never on a release
      # ref -- so this is the only gate between the tree and the index.
      - run: uv run pyright .
      - run: uv run pytest -v

      # The tag names the build. Local only: pushing it is the last thing the
      # release does, and the ruleset polices the push, not this.
      - run: git tag "v${{ steps.version.outputs.version }}"

      - run: uv build

      - name: the build must carry the version that was asked for
        run: ls dist/*-"${{ steps.version.outputs.version }}".tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The rehearsal must be re-runnable; a version already staged on
          # TestPyPI is not a reason to block the promote. Prod stays strict on
          # purpose.
          skip-existing: true

  # Whether PyPI recognizes this (repo, workflow, environment) as a publisher at
  # all -- something neither a local build nor the TestPyPI leg can tell you,
  # since that leg exercises a different registry's registration. The token is
  # never printed; it expires unused.
  probe-pypi-publisher:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: the trusted publisher must already accept this workflow
        run: |
          set -euo pipefail
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r .value)"
          curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$jwt\"}" |
            jq -e '.token | length > 0' >/dev/null
          echo "PyPI accepts this workflow as a publisher"

  publish-pypi:
    # Promote the *same* artifact the rehearsal accepted — not a rebuild, and
    # not in parallel with it.
    if: github.event_name == 'push'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    # The commit point, written last: the tag means "this version is on PyPI",
    # so it cannot precede the upload. If this job fails after a successful
    # upload, re-run *this job alone* (`gh run rerun --job`) -- the publish is
    # not repeated, and the release stays recoverable rather than half-done.
    if: github.event_name == 'push'
    needs: [verify-and-build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release identity: a write-scoped deploy key, and the only actor
          # the tag ruleset lets create `v*`. GITHUB_TOKEN cannot bypass a
          # ruleset on a user-owned repo, and a human is not supposed to.
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
      - name: record the release, then consume the request
        env:
          version: ${{ needs.verify-and-build.outputs.version }}
        run: |
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          git push origin --delete "$GITHUB_REF_NAME"
