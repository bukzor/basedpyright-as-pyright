# rationale: one registry per workflow keeps each trusted-publisher grant narrow
# — the workflow file is the RBAC unit. See, in template.python-project:
# docs/dev/technical-policy.kb/least-privilege-grants.md
name: Release (PyPI)

on:
  push:
    tags: ["v*"]

  # An upload cannot be taken back; a dispatch can. A dispatch runs everything
  # a tag run does except the prod upload: checks, build, TestPyPI rehearsal,
  # and a probe that PyPI accepts this workflow as a publisher.
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # The pyright wrapper and basedpyright run a JS engine via `node`.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # CI runs on pushes to main and on PRs, never on tags -- so the release
      # is the only thing standing between an unverified tree and the index.
      - run: uv run pyright .
      - run: uv run pytest -v

      - run: uv build

      # A published version is immutable, so a tag that disagrees with the
      # version in pyproject.toml must fail here rather than upload the wrong
      # number. The glob keeps the dist name in exactly one place.
      - name: the tag must name the version that was built
        if: github.event_name == 'push'
        run: ls dist/*-"${GITHUB_REF_NAME#v}".tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The rehearsal must be re-runnable (this workflow has
          # workflow_dispatch); a version already staged on TestPyPI is not a
          # reason to block the promote. Prod stays strict on purpose.
          skip-existing: true

  # Whether PyPI recognizes this (repo, workflow, environment) as a publisher at
  # all -- something neither a local build nor the TestPyPI leg can tell you,
  # since that leg exercises a different registry's registration. The token is
  # never printed; it expires unused.
  #
  # For the *first* release the definitive test is still the upload, and that is
  # free to fail: a missing publisher bounces with `400 Non-user identities
  # cannot create new projects`; register it, then `gh run rerun` this same run.
  # The tag does not move and the version is not burned.
  probe-pypi-publisher:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: the trusted publisher must already accept this workflow
        run: |
          set -euo pipefail
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r .value)"
          curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$jwt\"}" |
            jq -e '.token | length > 0' >/dev/null
          echo "PyPI accepts this workflow as a publisher"

  publish-pypi:
    # Promote the *same* artifact the rehearsal accepted — not a rebuild, and
    # not in parallel with it.
    if: github.event_name == 'push'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
