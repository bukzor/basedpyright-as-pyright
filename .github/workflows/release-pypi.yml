# rationale: one registry per workflow keeps each trusted-publisher grant narrow
# — the workflow file is the RBAC unit. See, in template.python-project:
# docs/dev/technical-policy.kb/least-privilege-grants.md
name: Release (PyPI)

# The request is a branch; the record is a tag. A human pushes
# `release/v1.2.3` -- an act that is attributable, reviewable, and revocable
# (delete the branch and nothing is burned) -- and the pipeline writes the
# `v1.2.3` tag only after the upload lands. A tag ruleset admits only the
# release deploy key, so no hand-pushed tag can claim a release happened.
on:
  push:
    branches: ["release/v*"]

  # An upload cannot be taken back; a dispatch can. Dispatch rehearses
  # everything except the prod upload and the tag.
  workflow_dispatch:
    inputs:
      version:
        description: version to rehearse, without the leading v (e.g. 0.2.0)
        required: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version out of tag history, and the ancestry
          # check below needs main.
          fetch-depth: 0

      - name: the branch names the version, or the dispatch input does
        env:
          dispatched: ${{ inputs.version }}
        run: |
          echo "version=${dispatched:-${GITHUB_REF_NAME#release/v}}" >>"$GITHUB_ENV"

      # A version is immutable once uploaded, so re-releasing one is always a
      # mistake -- catch it before the build rather than at the registry.
      - name: the version must not already be released
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released"
            exit 1
          fi

      # A release branch can point anywhere; only main has passed CI.
      - name: the release must name a commit on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: astral-sh/setup-uv@v7

      # The pyright wrapper and basedpyright run a JS engine via `node`.
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # CI runs on pushes to main and on PRs, never on a release ref -- so the
      # release is the only thing standing between the tree and the index.
      - run: uv run pyright .
      - run: uv run pytest -v

      # hatch-vcs answers a dirty tree with a dev version instead of an error,
      # so the cleanliness of the tree is load-bearing on what gets built.
      - name: the tree must be clean
        run: git diff --exit-code HEAD

      # The tag names the build. Local only: pushing it is the last thing the
      # release does, and the ruleset polices the push, not this.
      - run: git tag "v$version"

      - run: uv build

      - name: the build must carry the version that was asked for
        run: ls dist/*-"$version".tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: test
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # The rehearsal must be re-runnable; a version already staged on
          # TestPyPI is not a reason to block the promote. Prod stays strict on
          # purpose.
          skip-existing: true

  # Whether PyPI recognizes this (repo, workflow, environment) as a publisher at
  # all -- something neither a local build nor the TestPyPI leg can tell you,
  # since that leg exercises a different registry's registration. The token is
  # never printed; it expires unused.
  probe-pypi-publisher:
    if: github.event_name == 'workflow_dispatch'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: the trusted publisher must already accept this workflow
        run: |
          set -euo pipefail
          jwt="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi" | jq -r .value)"
          curl -sS -X POST https://pypi.org/_/oidc/mint-token \
            -d "{\"token\": \"$jwt\"}" |
            jq -e '.token | length > 0' >/dev/null
          echo "PyPI accepts this workflow as a publisher"

  publish-pypi:
    # Promote the *same* artifact the rehearsal accepted — not a rebuild, and
    # not in parallel with it.
    if: github.event_name == 'push'
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    # The commit point, written last: the tag means "this version is on PyPI",
    # so it cannot precede the upload. If this job fails after a successful
    # upload, re-run *this job alone* (`gh run rerun --job`) -- the publish is
    # not repeated, and the release stays recoverable rather than half-done.
    if: github.event_name == 'push'
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The release identity: a write-scoped deploy key, and the only actor
          # the tag ruleset lets create `v*`. GITHUB_TOKEN cannot bypass a
          # ruleset on a user-owned repo, and a human is not supposed to.
          ssh-key: ${{ secrets.RELEASE_TAG_SSH_KEY }}
      - name: record the release, then consume the request
        run: |
          version="${GITHUB_REF_NAME#release/v}"
          git tag "v$version" "$GITHUB_SHA"
          git push origin "v$version"
          git push origin --delete "$GITHUB_REF_NAME"
